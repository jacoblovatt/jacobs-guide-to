author: Jacob Lovatt
lang: en-GB
toc: true
number-sections: true
format:
  html:
    theme: [cosmo, ../../shared/book.scss]
    toc-depth: 3
    code-copy: true
    link-external-newwindow: false
  pdf:
    documentclass: scrreprt
    classoption: [oneside, openany]
    pdf-engine: xelatex
    latex-auto-install: false
    papersize: a4
    geometry: [margin=25mm]
    fontsize: 11pt
    mainfont: TeX Gyre Pagella
    sansfont: TeX Gyre Heros
    monofont: Latin Modern Mono
    colorlinks: true
    linkcolor: NavyBlue
    urlcolor: NavyBlue
    toc-depth: 2
    keep-tex: true
execute:
  eval: false
