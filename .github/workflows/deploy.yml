name: Publish guides (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guides-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Read tested Quarto version
        id: quarto
        run: echo "version=$(cat .quarto-version)" >> "$GITHUB_OUTPUT"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ steps.quarto.outputs.version }}
      - name: Install supported PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-texgyre poppler-utils
      - name: Read existing Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Confirm project prefix
        env:
          PAGES_PREFIX: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          expected = tomllib.loads(pathlib.Path('site.toml').read_text())['site']['prefix']
          actual = '/' + os.environ['PAGES_PREFIX'].strip('/') + '/'
          if actual != expected:
              raise SystemExit(f'Pages prefix {actual!r} differs from site.toml {expected!r}; review configuration first.')
          PY
      - run: make doctor
      - run: make public
      - run: make check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the assembled collection
        id: deployment
        uses: actions/deploy-pages@v4
